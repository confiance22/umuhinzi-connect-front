<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Umuhinzi Connect - list and buy fresh harvests directly from Rwandan farmers."
    />
    <link rel="icon" type="image/svg+xml" href="/umuhinzi-connect-logo.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1eff00" />
    <title>Umuhinzi Connect</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('umuhinzi_theme')
          if (theme !== 'light' && theme !== 'dark') theme = 'dark'
          var portal = /^\/(admin|buyer|farmer|dashboard|products|stock|customers|qr|workers|reports|settings|account|notifications|chat)(\/|$)/.test(window.location.pathname)
          if (theme === 'dark' && !portal) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = portal ? 'light' : theme
          var lang = localStorage.getItem('umuhinzi_lang')
          document.documentElement.lang = lang === 'rw' ? 'rw' : 'en'
        } catch (error) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
